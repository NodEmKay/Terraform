<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Style Demo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
    .header { background: #1e4d2b; color: #fff; padding: 20px; text-align: center; }
    .main { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
    .main h1 { color: #1e4d2b; }
    .main p { font-size: 1.2em; }
    .footer { background: #eee; color: #333; text-align: center; padding: 12px; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Welcome to Tesco United States</h1>
  </div>
  <div class="main">
    <h1>Costco-Style Landing Page</h1>
    <p>This is a demo page styled to look similar to Costco's clean and friendly design. Enjoy your savings!</p>
  </div>
  <div class="footer">
    &copy; 2026 Costco Demo. All rights reserved.
  </div>
</body>
</html>
